name: docspot

# Caddy + Spring Boot + Redis all on this VM. MySQL (Aiven) stays external.
# Run with:  docker compose -f docker-compose.local-redis.yml up -d --build
# Needs REDIS_LOCAL_PASSWORD in .env (see notes).

services:
  caddy:
    image: caddy:2-alpine
    container_name: docspot-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: docspot-redis
    restart: unless-stopped
    # No "ports:" on purpose. Redis is reachable only by other containers
    # on this compose network, never from the internet.
    command: >
      redis-server
      --requirepass ${REDIS_LOCAL_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    environment:
      REDISCLI_AUTH: ${REDIS_LOCAL_PASSWORD}   # lets the healthcheck authenticate
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: docspot-app:latest
    container_name: docspot-app
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-validate}

      # ---- Redis now points at the local container ----
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_LOCAL_PASSWORD}
      REDIS_SSL_ENABLED: "false"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      APP_SECURITY_BCRYPT_STRENGTH: 10
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SWAGGER_ENABLED: "true"

      # ---- OPTIONAL tuning: leave commented for the first test so that only
      # ---- Redis changes. Uncomment one at a time afterwards and re-test.
      # JAVA_OPTS: "-Xms1g -Xmx3g -XX:+UseG1GC -Xss512k -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError"
      # SERVER_TOMCAT_THREADS_MAX: "40"
      # SERVER_TOMCAT_ACCEPT_COUNT: "100"
      # SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "15"
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
  redis_data: