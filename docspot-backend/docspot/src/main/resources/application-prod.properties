spring.application.name=docspot

# ==================== SERVER (Render) ====================
# Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=30

# ==================== DATASOURCE (Aiven MySQL) ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=300000

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF

# ==================== JWT SECURITY ====================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# BCrypt cost: 10 is a sensible default; use 8 temporarily for load tests on the free tier
app.security.bcrypt-strength=${APP_SECURITY_BCRYPT_STRENGTH:10}

# Cookie Configuration for Cross-Site Auth (Vercel <-> Render)
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.cookie.domain=${COOKIE_DOMAIN:}

# ==================== MAIL (Brevo SMTP) ====================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Verified custom domain sender (e.g., noreply@yourdomain.com)
app.mail.from=${MAIL_FROM}

# ==================== REDIS (Upstash Cloud) ====================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
# 3s instead of 60s: a slow Upstash must not pin your 10 Tomcat threads
spring.data.redis.timeout=3000ms

# OTP Rate Limiting Settings
otp.ttl-minutes=10
otp.max-attempts=5
otp.resend-cooldown-seconds=60
otp.hmac-secret=${OTP_HMAC_SECRET}

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/docs}

# ==================== ADMIN SEED ====================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=DocSpot Admin

# ==================== SWAGGER / OPENAPI ====================
# Off by default to save memory/CPU; set SWAGGER_ENABLED=true in Render when you need it
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method