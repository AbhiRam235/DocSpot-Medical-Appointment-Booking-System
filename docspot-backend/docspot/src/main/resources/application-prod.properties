spring.application.name=docspot

# ==================== SERVER ====================
server.port=${PORT:8080}
# The old values (10 threads, accept-count 30) capped concurrency.
# Most request time is spent waiting on I/O, so more threads than cores is fine.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# ==================== DATASOURCE (Aiven MySQL) ====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Keep maximum-pool-size BELOW your Aiven plan's max connections.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=300000

# OPTIONAL: fewer chatty round trips to the remote DB. Only enable if you still
# see DB-bound latency after the cache changes. If the app fails to start, remove them.
# spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
# spring.datasource.hikari.data-source-properties.useLocalSessionState=true
# spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
# spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
# OPTIONAL best practice: stops Hibernate sessions living for the whole request.
# Test your endpoints after enabling: it can cause LazyInitializationException
# if any controller or mapper touches lazy fields outside a transaction.
# spring.jpa.open-in-view=false

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF

# ==================== JWT SECURITY ====================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# BCrypt cost: 10 is a sensible default
app.security.bcrypt-strength=${APP_SECURITY_BCRYPT_STRENGTH:10}

# In-process cache for the per-request user lookup (UserDetailsServiceImpl)
app.security.user-cache-ttl-seconds=60
app.security.user-cache-max-size=10000

# Cookie configuration
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}
app.cookie.domain=${COOKIE_DOMAIN:}

# ==================== MAIL (Brevo SMTP) ====================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM}

# ==================== REDIS (local container) ====================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}
# Redis is local now, so fail fast. Without a timeout, Lettuce waits up to 60 s
# on a stuck command, which would freeze request threads if Redis ever hangs.
spring.data.redis.timeout=1000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=3000ms

# OTP Rate Limiting Settings
otp.ttl-minutes=10
otp.max-attempts=5
otp.resend-cooldown-seconds=60
otp.hmac-secret=${OTP_HMAC_SECRET}

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/docs}

# ==================== ADMIN SEED ====================
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=DocSpot Admin

# ==================== SWAGGER / OPENAPI ====================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method