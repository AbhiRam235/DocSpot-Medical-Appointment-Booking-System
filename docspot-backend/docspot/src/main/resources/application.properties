spring.application.name=docspot

# ==================== DATABASE ====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docspot_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT ====================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=604800000

# ==================== MAIL (Gmail SMTP) ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/docs

# ==================== ADMIN SEED ====================
app.admin.email=${ADMIN_EMAIL:admin@docspot.com}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:System Admin}

# ==================== SWAGGER ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method